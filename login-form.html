<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Connexion / Inscription</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap");
        
        :root {
            --bg-primary: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --bg-form: rgba(255, 255, 255, 0.95);
            --text-primary: #333;
            --text-secondary: #666;
            --text-muted: #aaa;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: transparent;
            --input-focus: #667eea;
            --shadow-light: rgba(0, 0, 0, 0.05);
            --shadow-medium: rgba(0, 0, 0, 0.1);
            --shadow-heavy: rgba(0, 0, 0, 0.2);
            --gradient-main: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-circle: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }
        
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --bg-form: rgba(30, 30, 45, 0.95);
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #707070;
            --input-bg: rgba(40, 40, 60, 0.9);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: #8b9eff;
            --shadow-light: rgba(0, 0, 0, 0.3);
            --shadow-medium: rgba(0, 0, 0, 0.4);
            --shadow-heavy: rgba(0, 0, 0, 0.6);
            --gradient-main: linear-gradient(135deg, #8b9eff 0%, #a78bfa 100%);
            --gradient-circle: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, input {
            font-family: "Poppins", sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .theme-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 1000;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--shadow-medium);
            transition: all 0.3s ease;
        }
        
        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 6px 20px var(--shadow-heavy);
        }
        
        .theme-toggle svg {
            width: 28px;
            height: 28px;
            transition: all 0.3s ease;
        }
        
        .theme-toggle .sun-icon {
            display: none;
        }
        
        [data-theme="dark"] .theme-toggle .sun-icon {
            display: block;
        }
        
        [data-theme="dark"] .theme-toggle .moon-icon {
            display: none;
        }
        
        .container {
            position: relative;
            width: 100%;
            background: var(--bg-primary);
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease;
        }
        
        .forms-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        
        .signin-signup {
            position: absolute;
            top: 50%;
            left: 75%;
            transform: translate(-50%, -50%);
            width: 50%;
            transition: 1s 0.7s ease-in-out;
            display: grid;
            grid-template-columns: 1fr;
            z-index: 5;
        }
        
        form {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0rem 5rem;
            transition: all 0.2s 0.7s;
            overflow: hidden;
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            background: var(--bg-form);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        form.sign-up-form {
            opacity: 0;
            z-index: 1;
        }
        
        form.sign-in-form {
            z-index: 2;
        }
        
        .title {
            font-size: 2.2rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        form > span {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 15px 0;
        }
        
        form > a {
            color: #667eea;
            text-decoration: none;
            margin: 10px 0;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        
        form > a:hover {
            color: #764ba2;
        }
        
        [data-theme="dark"] form > a {
            color: #8b9eff;
        }
        
        [data-theme="dark"] form > a:hover {
            color: #a78bfa;
        }
        
        .input-field {
            max-width: 380px;
            width: 100%;
            background: var(--input-bg);
            backdrop-filter: blur(10px);
            margin: 10px 0;
            height: 55px;
            border-radius: 55px;
            display: grid;
            grid-template-columns: 15% 85%;
            padding: 0 0.4rem;
            position: relative;
            box-shadow: 0 5px 15px var(--shadow-light);
            border: 2px solid var(--input-border);
            transition: all 0.3s ease;
        }
        
        .input-field:focus-within {
            border: 2px solid var(--input-focus);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        
        [data-theme="dark"] .input-field:focus-within {
            box-shadow: 0 8px 20px rgba(139, 158, 255, 0.3);
        }
        
        .input-field svg {
            margin: auto;
            width: 20px;
            height: 20px;
            transition: 0.3s;
        }
        
        .input-field:focus-within svg {
            transform: scale(1.1);
        }
        
        .input-field input {
            background: none;
            outline: none;
            border: none;
            line-height: 1;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        
        .input-field input::placeholder {
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .social-text {
            padding: 0.7rem 0;
            font-size: 1rem;
        }
        
        .social-media {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        
        .social-icon {
            height: 50px;
            width: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            border-radius: 50%;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--shadow-medium);
        }
        
        .social-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: 0.3s;
            z-index: -1;
        }
        
        .social-icon.facebook::before {
            background: linear-gradient(135deg, #1877f2 0%, #0d5dbf 100%);
        }
        
        .social-icon.google::before {
            background: linear-gradient(135deg, #ea4335 0%, #fbbc05 50%, #34a853 100%);
        }
        
        .social-icon.linkedin::before {
            background: linear-gradient(135deg, #0077b5 0%, #005582 100%);
        }
        
        .social-icon:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 25px var(--shadow-heavy);
        }
        
        .social-icon svg {
            width: 22px;
            height: 22px;
            fill: white;
            position: relative;
            z-index: 1;
        }
        
        .btn {
            width: 150px;
            background: var(--gradient-main);
            border: none;
            outline: none;
            height: 49px;
            border-radius: 49px;
            color: #fff;
            text-transform: uppercase;
            font-weight: 600;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        [data-theme="dark"] .btn {
            box-shadow: 0 4px 15px rgba(139, 158, 255, 0.4);
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transition: 0.3s;
        }
        
        [data-theme="dark"] .btn::before {
            background: linear-gradient(135deg, #a78bfa 0%, #8b9eff 100%);
        }
        
        .btn:hover::before {
            left: 0;
        }
        
        .btn span {
            position: relative;
            z-index: 1;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        [data-theme="dark"] .btn:hover {
            box-shadow: 0 6px 20px rgba(139, 158, 255, 0.6);
        }
        
        .panels-container {
            position: absolute;
            height: 100%;
            width: 100%;
            top: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }
        
        .container:before {
            content: "";
            position: absolute;
            height: 2000px;
            width: 2000px;
            top: -10%;
            right: 48%;
            transform: translateY(-50%);
            background: var(--gradient-circle);
            transition: 1.8s ease-in-out;
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
        }
        
        [data-theme="dark"] .container:before {
            box-shadow: 0 20px 60px rgba(139, 158, 255, 0.4);
        }
        
        .image {
            width: 100%;
            transition: transform 1.1s ease-in-out;
            transition-delay: 0.4s;
            filter: drop-shadow(0 10px 30px var(--shadow-heavy));
        }
        
        .panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-around;
            text-align: center;
            z-index: 6;
        }
        
        .left-panel {
            pointer-events: all;
            padding: 3rem 17% 2rem 12%;
        }
        
        .right-panel {
            pointer-events: none;
            padding: 3rem 12% 2rem 17%;
        }
        
        .panel .content {
            color: #fff;
            transition: transform 0.9s ease-in-out;
            transition-delay: 0.6s;
        }
        
        .panel h3 {
            font-weight: 700;
            line-height: 1;
            font-size: 1.8rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .panel p {
            font-size: 1rem;
            padding: 0.7rem 0;
            opacity: 0.95;
        }
        
        .btn.transparent {
            margin: 0;
            background: transparent;
            border: 2px solid #fff;
            width: 150px;
            height: 45px;
            font-weight: 600;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
        }
        
        .btn.transparent::before {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .btn.transparent:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }
        
        .right-panel .image,
        .right-panel .content {
            transform: translateX(800px);
        }
        
        /* Animation */
        .container.sign-up-mode:before {
            transform: translate(100%, -50%);
            right: 52%;
        }
        
        .container.sign-up-mode .left-panel .image,
        .container.sign-up-mode .left-panel .content {
            transform: translateX(-800px);
        }
        
        .container.sign-up-mode .signin-signup {
            left: 25%;
        }
        
        .container.sign-up-mode form.sign-up-form {
            opacity: 1;
            z-index: 2;
        }
        
        .container.sign-up-mode form.sign-in-form {
            opacity: 0;
            z-index: 1;
        }
        
        .container.sign-up-mode .right-panel .image,
        .container.sign-up-mode .right-panel .content {
            transform: translateX(0%);
        }
        
        .container.sign-up-mode .left-panel {
            pointer-events: none;
        }
        
        .container.sign-up-mode .right-panel {
            pointer-events: all;
        }
        
        @media (max-width: 870px) {
            .theme-toggle {
                top: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
            }
            
            .theme-toggle svg {
                width: 24px;
                height: 24px;
            }
            
            .container {
                min-height: 800px;
                height: 100vh;
            }
            .signin-signup {
                width: 100%;
                top: 95%;
                transform: translate(-50%, -100%);
                transition: 1s 0.8s ease-in-out;
            }
            .signin-signup,
            .container.sign-up-mode .signin-signup {
                left: 50%;
            }
            .panels-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 2fr 1fr;
            }
            .panel {
                flex-direction: row;
                justify-content: space-around;
                align-items: center;
                padding: 2.5rem 8%;
                grid-column: 1 / 2;
            }
            .right-panel {
                grid-row: 3 / 4;
            }
            .left-panel {
                grid-row: 1 / 2;
            }
            .image {
                width: 200px;
                transition: transform 0.9s ease-in-out;
                transition-delay: 0.6s;
            }
            .panel .content {
                padding-right: 15%;
                transition: transform 0.9s ease-in-out;
                transition-delay: 0.8s;
            }
            .panel h3 {
                font-size: 1.2rem;
            }
            .panel p {
                font-size: 0.7rem;
                padding: 0.5rem 0;
            }
            .btn.transparent {
                width: 110px;
                height: 35px;
                font-size: 0.7rem;
            }
            .container:before {
                width: 1500px;
                height: 1500px;
                transform: translateX(-50%);
                left: 30%;
                bottom: 68%;
                right: initial;
                top: initial;
                transition: 2s ease-in-out;
            }
            .container.sign-up-mode:before {
                transform: translate(-50%, 100%);
                bottom: 32%;
                right: initial;
            }
            .container.sign-up-mode .left-panel .image,
            .container.sign-up-mode .left-panel .content {
                transform: translateY(-300px);
            }
            .container.sign-up-mode .right-panel .image,
            .container.sign-up-mode .right-panel .content {
                transform: translateY(0px);
            }
            .right-panel .image,
            .right-panel .content {
                transform: translateY(300px);
            }
            .container.sign-up-mode .signin-signup {
                top: 5%;
                transform: translate(-50%, 0);
            }
        }
        
        @media (max-width: 570px) {
            form {
                padding: 0 1.5rem;
            }
            .image {
                display: none;
            }
            .panel .content {
                padding: 0.5rem 1rem;
            }
            .container {
                padding: 1.5rem;
            }
            .container:before {
                bottom: 72%;
                left: 50%;
            }
            .container.sign-up-mode:before {
                bottom: 28%;
                left: 50%;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                </linearGradient>
            </defs>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="url(#moonGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="url(#moonGrad)"/>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ffed4e;stop-opacity:1" />
                </linearGradient>
            </defs>
            <circle cx="12" cy="12" r="5" stroke="url(#sunGrad)" stroke-width="2" fill="url(#sunGrad)"/>
            <line x1="12" y1="1" x2="12" y2="3" stroke="url(#sunGrad)" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="21" x2="12" y2="23" stroke="url(#sunGrad)" stroke-width="2" stroke-linecap="round"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="url(#sunGrad)" stroke-width="2" stroke-linecap="round"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="url(#sunGrad)" stroke-width="2" stroke-linecap="round"/>
            <line x1="1" y1="12" x2="3" y2="12" stroke="url(#sunGrad)" stroke-width="2" stroke-linecap="round"/>
            <line x1="21" y1="12" x2="23" y2="12" stroke="url(#sunGrad)" stroke-width="2" stroke-linecap="round"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="url(#sunGrad)" stroke-width="2" stroke-linecap="round"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="url(#sunGrad)" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>

    <div class="container">
        <!-- Formulaires -->
        <div class="forms-container">
            <div class="signin-signup">
                <!-- Formulaire Inscription -->
                <form action="#" class="sign-up-form">
                    <h2 class="title">S'inscrire</h2>
                    <div class="social-media">
                        <a href="#" class="social-icon facebook">

                        <a href="#" class="social-icon linkedin">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                            </svg>
                        </a>
                    </div>
                    <span>ou utilisez votre email pour vous inscrire</span>
                    <div class="input-field">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" stroke="url(#userGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.5899 22C20.5899 18.13 16.7399 15 11.9999 15C7.25991 15 3.40991 18.13 3.40991 22" stroke="url(#userGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="text" placeholder="Nom" />
                    </div>
                    <div class="input-field">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="emailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="url(#emailGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- JavaScript -->
    <script>
        // Form toggle functionality
        const sign_in_btn = document.querySelector("#sign-in-btn");
        const sign_up_btn = document.querySelector("#sign-up-btn");
        const container = document.querySelector(".container");
        
        sign_up_btn.addEventListener("click", () => {
            container.classList.add("sign-up-mode");
        });
        
        sign_in_btn.addEventListener("click", () => {
            container.classList.remove("sign-up-mode");
        });
        
        // Theme toggle functionality
        const themeToggle = document.querySelector("#theme-toggle");
        const htmlElement = document.documentElement;
        
        // Check for saved theme preference or default to 'light'
        const currentTheme = localStorage.getItem("theme") || "light";
        htmlElement.setAttribute("data-theme", currentTheme);
        
        themeToggle.addEventListener("click", () => {
            const currentTheme = htmlElement.getAttribute("data-theme");
            const newTheme = currentTheme === "light" ? "dark" : "light";
            
            htmlElement.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        });
    </script>
